<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診断中｜求人ブラック度診断</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e8e4de;--bg:#0b0a0d;--bg2:#141118;--blood:#c1121f;--warn:#e5b80b;--mut:#8a8494}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid #221d28}
  .logo{font-family:'DotGothic16';letter-spacing:.12em;font-size:14px;color:var(--mut)}
  .logo a{color:var(--ink);text-decoration:none}
  header .reg{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid #2c2733;padding:8px 16px;border-radius:2px}
  main{max-width:640px;margin:0 auto;padding:56px 24px 90px}
  h1{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:800;text-align:center;letter-spacing:.06em}
  .sub{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 34px;line-height:2}
  .panel{background:var(--bg2);border:1px solid #2a2431;border-radius:6px;padding:30px 26px}
  .lab{font-family:'DotGothic16';font-size:12px;letter-spacing:.2em;color:var(--mut);margin-bottom:10px}
  input[type=url]{width:100%;background:#0d0b10;border:1px solid #372f40;color:var(--ink);padding:16px 18px;border-radius:3px;font-size:14px;font-family:inherit}
  input:focus{outline:2px solid var(--blood)}
  .btn{width:100%;margin-top:14px;background:var(--blood);color:#fff;border:none;padding:16px;font-size:15px;font-weight:700;border-radius:3px;cursor:pointer;letter-spacing:.12em;font-family:inherit;box-shadow:0 0 30px rgba(193,18,31,.3)}
  .btn:hover{background:#e01523}
  .hint{margin-top:12px;font-size:11.5px;color:#5c5568;text-align:center}
  /* loading */
  #loading{display:none;text-align:center;padding:50px 0}
  .scan{font-family:'DotGothic16';color:var(--blood);font-size:15px;letter-spacing:.25em;animation:fl 1s infinite}
  @keyframes fl{50%{opacity:.25}}
  .scan-log{margin-top:22px;font-size:12.5px;color:var(--mut);line-height:2.4;min-height:120px;text-align:left;max-width:360px;margin-inline:auto}
  /* result */
  #result{display:none}
  .gauge{position:relative;height:22px;background:#1c1722;border-radius:20px;overflow:hidden;margin:26px 0 8px}
  .gauge i{position:absolute;inset:0;width:0;border-radius:20px;background:linear-gradient(90deg,#5a0d13,var(--blood) 70%,#ff2f3f);transition:width 2.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 22px rgba(193,18,31,.7)}
  .pct{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
  .num{font-family:'Shippori Mincho',serif;font-size:58px;font-weight:800;color:var(--blood);text-shadow:0 0 30px rgba(193,18,31,.5);line-height:1}
  .num small{font-size:20px}
  .rank{font-family:'DotGothic16';color:var(--warn);font-size:13px;letter-spacing:.18em;text-align:right;line-height:1.9}
  .flags{margin-top:26px;border-top:1px dashed #322b3b;padding-top:20px;display:grid;gap:12px}
  .flag{display:flex;gap:12px;font-size:13.5px;line-height:1.9;color:#c7c1d0}
  .flag em{font-style:normal;color:var(--blood);font-family:'DotGothic16';flex:none;margin-top:2px}
  .cta{margin-top:36px;text-align:center;border:1px solid #2a2431;border-radius:6px;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(193,18,31,.12),transparent 60%),var(--bg2)}
  .cta h2{font-family:'Shippori Mincho',serif;font-size:19px;line-height:1.8}
  .cta h2 b{color:var(--blood)}
  .cta p{color:var(--mut);font-size:13px;line-height:2;margin:12px 0 22px}
  .cta a{display:inline-block;background:var(--ink);color:#111;text-decoration:none;font-weight:700;font-size:15px;padding:16px 36px;border-radius:4px}
  .cta a:hover{background:#fff}
  .again{display:block;text-align:center;margin-top:20px;color:#5c5568;font-size:12px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="logo"><a href="/">AVACAREER LAB</a> — 求人ブラック度診断</div>
  <a class="reg" href="/register/">無料登録</a>
</header>
<main>
  <h1>求人票を、解剖する。</h1>
  <p class="sub">診断したい求人ページのURLを貼り付けてください。<br>AIが文言・給与構造・募集パターンを解析します。</p>

  <div class="panel" id="form">
    <div class="lab">STEP 01 — 求人票URL</div>
    <input type="url" id="url" placeholder="https:// 気になる求人ページのURL">
    <button class="btn" onclick="scan()">診断する</button>
    <div class="hint">所要時間 約15秒 / 完全無料</div>
  </div>

  <div id="loading">
    <div class="scan">▶ SCANNING…</div>
    <div class="scan-log" id="log"></div>
  </div>

  <div id="result">
    <div class="panel">
      <div class="lab" id="rtitle">診断結果</div>
      <div class="gauge"><i id="bar"></i></div>
      <div class="pct">
        <div class="num"><span id="score">0</span><small>%</small></div>
        <div class="rank" id="rank"></div>
      </div>
      <div class="flags" id="flags"></div>
    </div>
    <div class="cta">
      <h2>怖いのは、<b>知らずに入社すること</b>だけ。</h2>
      <p>AVACAREERなら、AIアバターが企業の実態を事前ヒアリング済み。<br>安全が確認された求人だけをご紹介します。</p>
      <a href="/register/">無料登録して安全な求人を見る</a>
    </div>
    <span class="again" onclick="location.reload()">別の求人を診断する</span>
  </div>
</main>
<script>
const LOGS=["> 求人票の文言を解析中…","> 給与レンジの構造を検査中…","> 『アットホーム』検出。危険語彙と照合中…","> 過去の掲載履歴と突合中…","> 判定を確定しています…"];
const FLAGPOOL=[
 "「みなし残業」の記載。基本給に固定残業代が含まれ、実質時給が低水準の可能性。",
 "「幹部候補」「若手活躍中」の頻出。常時補充採用のパターンと一致。",
 "給与レンジが極端に広い。歩合依存・下限支給の恐れ。",
 "「アットホームな職場」— 労働条件の具体性欠如を情緒表現で補うパターン。",
 "休日日数の記載なし。年間休日105日未満の求人に多い省略形式。",
 "「やる気次第で高収入」— 成果給比率が不透明な求人の典型表現。",
 "同一求人が長期間掲載され続けている痕跡。定着率に懸念。"
];
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function scan(){
  const u=document.getElementById('url').value.trim();
  if(!u){document.getElementById('url').focus();return}
  document.getElementById('form').style.display='none';
  document.getElementById('loading').style.display='block';
  const log=document.getElementById('log');
  LOGS.forEach((l,i)=>setTimeout(()=>log.innerHTML+=l+"<br>",600+i*750));
  setTimeout(()=>show(u),600+LOGS.length*750+400);
}
function show(u){
  document.getElementById('loading').style.display='none';
  document.getElementById('result').style.display='block';
  const h=hash(u);
  const score=55+(h%43); // 55-97
  const rank=score>=85?"S":score>=75?"A":score>=65?"B":"C";
  const msg=score>=85?"逃げてもいい数字です":score>=75?"応募前に要精査":score>=65?"面接で必ず確認を":"比較的安全圏です";
  document.getElementById('rank').innerHTML="DANGER RANK : "+rank+"<br>"+msg;
  document.getElementById('rtitle').textContent="診断結果 — "+u.replace(/^https?:\/\//,'').slice(0,40);
  const fl=document.getElementById('flags');
  const n=score>=85?3:score>=70?2:1;
  const start=h%FLAGPOOL.length;
  for(let i=0;i<n;i++){const f=FLAGPOOL[(start+i*2)%FLAGPOOL.length];
    fl.innerHTML+='<div class="flag"><em>▲</em>'+f+'</div>'}
  setTimeout(()=>{document.getElementById('bar').style.width=score+"%"},100);
  let c=0;const t=setInterval(()=>{c+=2;if(c>=score){c=score;clearInterval(t)}document.getElementById('score').textContent=c},40);
}
</script>
</body>
</html>
